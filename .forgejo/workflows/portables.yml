name: Build Portable Python App

on:
  release:
    types: [published]

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # -------------------------------
      # Build Windows EXEs
      # -------------------------------

      - name: Build Python script EXE
        shell: powershell
        run: |
          cd src
          pyinstaller --clean --onedir --icon=../icon.ico python_postar.py

      - name: Build GUI EXE
        shell: powershell
        run: |
          cd src
          pyinstaller --clean --onedir `
            --contents-directory gui_internal `
            --collect-all PyQt6-WebEngine `
            --add-data "../css;css" `
            --add-data "../translations/*.qm;translations" `
            --add-data "../qt_translations;qt_translations" `
            --add-data "../themes;themes" `
            --icon=../icon.ico `
            gui.pyw `
            -n python_postar_gui

      - name: Build Updater GUI EXE
        shell: powershell
        run: |
          cd src
          pyinstaller --clean --onefile `
            --icon=../icon.ico `
            updater.py `
            -n updater

      - name: Prepare portable folder
        shell: powershell
        run: |
          $STAGE = "src\dist\python_postar_portable"

          New-Item -ItemType Directory -Force -Path "$STAGE\scripts"
          New-Item -ItemType Directory -Force -Path "$STAGE\css"
          New-Item -ItemType Directory -Force -Path "$STAGE\translations"
          New-Item -ItemType Directory -Force -Path "$STAGE\qt_translations"
          New-Item -ItemType Directory -Force -Path "$STAGE\themes"

          # CLI
          Copy-Item -Recurse src\dist\python_postar\* "$STAGE\"

          # GUI
          Copy-Item -Recurse src\dist\python_postar_gui\* "$STAGE\"

          # Updater
          Copy-Item src\dist\updater.exe "$STAGE\"

          # Other files
          Copy-Item icon.ico "$STAGE\"
          Copy-Item -Recurse guides "$STAGE\"
          Copy-Item -Recurse css\* "$STAGE\css\"
          Copy-Item -Recurse translations\* "$STAGE\translations\"
          Copy-Item -Recurse qt_translations\* "$STAGE\qt_translations\"
          Copy-Item -Recurse themes\* "$STAGE\themes\"
          Copy-Item scripts\postar_batch_portable.bat "$STAGE\scripts\"

      - name: Package portable ZIP
        shell: powershell
        env:
          RELEASE_TAG: ${{ forgejo.ref_name }}
        run: |
          $DIST_FOLDER = (Resolve-Path "src\dist\python_postar_portable").Path
          $ZIP_NAME = "python_postar_windows_${env:RELEASE_TAG}_portable.zip"

          if (Test-Path $ZIP_NAME) {
            Remove-Item $ZIP_NAME -Force
          }

          Add-Type -AssemblyName System.IO.Compression
          Add-Type -AssemblyName System.IO.Compression.FileSystem

          $zip = [System.IO.Compression.ZipFile]::Open(
            $ZIP_NAME,
            [System.IO.Compression.ZipArchiveMode]::Create
          )

          try {
            Get-ChildItem -Path $DIST_FOLDER -Recurse -File | ForEach-Object {
              $relativePath = $_.FullName.Substring($DIST_FOLDER.Length + 1)

              # ZIP standard uses / regardless of operating system
              $relativePath = $relativePath.Replace('\', '/')

              Write-Host "Adding: $relativePath"

              [System.IO.Compression.ZipFileExtensions]::CreateEntryFromFile(
                $zip,
                $_.FullName,
                $relativePath,
                [System.IO.Compression.CompressionLevel]::Optimal
              )
            }
          }
          finally {
            $zip.Dispose()
          }

          Write-Host "Created $ZIP_NAME"

      # -------------------------------
      # Upload to existing Forgejo release
      # -------------------------------

      - name: Upload release asset
        shell: powershell
        env:
          FORGEJO_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          FORGEJO_SERVER: ${{ forgejo.server_url }}
          FORGEJO_REPOSITORY: ${{ forgejo.repository }}
          RELEASE_TAG: ${{ forgejo.ref_name }}
        run: |
          $ErrorActionPreference = "Stop"

          $headers = @{
            "Authorization" = "token $env:FORGEJO_TOKEN"
            "Accept" = "application/json"
          }

          # -------------------------------
          # Find existing release by tag
          # -------------------------------

          Write-Host "Looking up Forgejo release: $env:RELEASE_TAG"

          $release = Invoke-RestMethod `
            -Uri "$env:FORGEJO_SERVER/api/v1/repos/$env:FORGEJO_REPOSITORY/releases/tags/$env:RELEASE_TAG" `
            -Method Get `
            -Headers $headers

          Write-Host "Found release ID: $($release.id)"
          Write-Host "Release: $($release.name)"

          # -------------------------------
          # Find ZIP
          # -------------------------------

          $zip = Get-ChildItem `
            -Path "." `
            -Filter "python_postar_windows_*.zip" |
            Select-Object -First 1

          if (-not $zip) {
            throw "Could not find python_postar_windows_*.zip"
          }

          Write-Host "Uploading: $($zip.FullName)"

          # -------------------------------
          # Upload ZIP
          # -------------------------------

          $encodedName = [uri]::EscapeDataString($zip.Name)

          $uploadUrl = "$env:FORGEJO_SERVER/api/v1/repos/$env:FORGEJO_REPOSITORY/releases/$($release.id)/assets?name=$encodedName"

          $uploadHeaders = @{
            "Authorization" = "token $env:FORGEJO_TOKEN"
            "Accept" = "application/json"
          }

          Invoke-RestMethod `
            -Uri $uploadUrl `
            -Method Post `
            -Headers $uploadHeaders `
            -ContentType "application/zip" `
            -InFile $zip.FullName

          Write-Host ""
          Write-Host "Successfully uploaded $($zip.Name)"
          Write-Host "Release: $env:RELEASE_TAG"
