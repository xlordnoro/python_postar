name: Build Portable Python App

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Show workspace
        shell: powershell
        run: |
          Write-Host "Current directory:"
          Get-Location

          Write-Host ""
          Write-Host "Workspace environment variables:"
          Get-ChildItem Env:FORGEJO* | Format-Table -AutoSize

          Write-Host ""
          Write-Host "Repository root:"
          Get-ChildItem

          Write-Host ""
          Write-Host "src directory:"
          Get-ChildItem .\src

          Write-Host ""
          Write-Host "Python:"
          python --version
          Get-Command python

          Write-Host ""
          Write-Host "PyInstaller:"
          pyinstaller --version
          Get-Command pyinstaller

      # -------------------------------
      # Build Windows EXEs
      # -------------------------------

      - name: Build Python script EXE
        shell: powershell
        run: |
          cd src
          pyinstaller --clean --onedir --icon=../icon.ico python_postar.py

      - name: Build GUI EXE
        shell: powershell
        run: |
          cd src
          pyinstaller --clean --onedir `
            --contents-directory gui_internal `
            --collect-all PyQt6-WebEngine `
            --add-data "../css;css" `
            --add-data "../translations/*.qm;translations" `
            --add-data "../qt_translations;qt_translations" `
            --add-data "../themes;themes" `
            --icon=../icon.ico `
            gui.pyw `
            -n python_postar_gui

      - name: Build Updater GUI EXE
        shell: powershell
        run: |
          cd src
          pyinstaller --clean --onefile `
            --icon=../icon.ico `
            updater.py `
            -n updater

      # -------------------------------
      # Prepare portable folder
      # -------------------------------

      - name: Prepare portable folder
        shell: powershell
        run: |
          $STAGE = "src\dist\python_postar_portable"

          New-Item -ItemType Directory -Force -Path "$STAGE\scripts"
          New-Item -ItemType Directory -Force -Path "$STAGE\css"
          New-Item -ItemType Directory -Force -Path "$STAGE\translations"
          New-Item -ItemType Directory -Force -Path "$STAGE\qt_translations"
          New-Item -ItemType Directory -Force -Path "$STAGE\themes"

          # CLI
          Copy-Item -Recurse "src\dist\python_postar\*" "$STAGE\"

          # GUI
          Copy-Item -Recurse "src\dist\python_postar_gui\*" "$STAGE\"

          # Updater
          Copy-Item "src\dist\updater.exe" "$STAGE\"

          # Other files
          Copy-Item "icon.ico" "$STAGE\"
          Copy-Item -Recurse "guides" "$STAGE\"
          Copy-Item -Recurse "css\*" "$STAGE\css\"
          Copy-Item -Recurse "translations\*" "$STAGE\translations\"
          Copy-Item -Recurse "qt_translations\*" "$STAGE\qt_translations\"
          Copy-Item -Recurse "themes\*" "$STAGE\themes\"
          Copy-Item "scripts\postar_batch_portable.bat" "$STAGE\scripts\"

      # -------------------------------
      # Package
      # -------------------------------

      - name: Package portable ZIP
        shell: powershell
        env:
          RELEASE_TAG: ${{ forgejo.ref_name }}
        run: |
          $DIST_FOLDER = "src\dist\python_postar_portable"
          $ZIP_NAME = "python_postar_windows_${env:RELEASE_TAG}_portable.zip"

          Compress-Archive `
            -Path "$DIST_FOLDER\*" `
            -DestinationPath $ZIP_NAME `
            -Force

          Write-Host "Created $ZIP_NAME"

      - name: Create release
        shell: powershell
        env:
          FORGEJO_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          FORGEJO_SERVER: ${{ forgejo.server_url }}
          FORGEJO_REPOSITORY: ${{ forgejo.repository }}
          RELEASE_TAG: ${{ forgejo.ref_name }}
        run: |
          $ErrorActionPreference = "Stop"

          $headers = @{
            "Authorization" = "token $env:FORGEJO_TOKEN"
            "Accept" = "application/json"
            "Content-Type" = "application/json"
          }

          # -------------------------------
          # Create Forgejo release
          # -------------------------------

          $releaseBody = @{
            tag_name = $env:RELEASE_TAG
            name = $env:RELEASE_TAG
            body = "Windows portable build"
          } | ConvertTo-Json

          Write-Host "Creating Forgejo release $env:RELEASE_TAG..."

          $release = Invoke-RestMethod `
            -Uri "$env:FORGEJO_SERVER/api/v1/repos/$env:FORGEJO_REPOSITORY/releases" `
            -Method Post `
            -Headers $headers `
            -Body $releaseBody

          Write-Host "Created release ID: $($release.id)"

          # -------------------------------
          # Find ZIP
          # -------------------------------

          $zip = Get-ChildItem -Path "." -Filter "python_postar_windows_*.zip" |
            Select-Object -First 1

          if (-not $zip) {
            throw "Could not find python_postar_windows_*.zip"
          }

          Write-Host "Uploading: $($zip.FullName)"

          # -------------------------------
          # Upload ZIP to release
          # -------------------------------

          $uploadUrl = "$env:FORGEJO_SERVER/api/v1/repos/$env:FORGEJO_REPOSITORY/releases/$($release.id)/assets?name=$([uri]::EscapeDataString($zip.Name))"

          $uploadHeaders = @{
            "Authorization" = "token $env:FORGEJO_TOKEN"
            "Accept" = "application/json"
          }

          Invoke-RestMethod `
            -Uri $uploadUrl `
            -Method Post `
            -Headers $uploadHeaders `
            -ContentType "application/zip" `
            -InFile $zip.FullName

          Write-Host "Successfully uploaded $($zip.Name)"
