name: Build Portable Python App

on:
  release:
    types: [published]

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # -------------------------------
      # Build Windows EXEs
      # -------------------------------

      - name: Build Python script EXE
        shell: powershell
        run: |
          cd src
          pyinstaller --clean --onedir --icon=../icon.ico python_postar.py

      - name: Build GUI EXE
        shell: powershell
        run: |
          cd src
          pyinstaller --clean --onedir `
            --contents-directory gui_internal `
            --collect-all PyQt6-WebEngine `
            --add-data "../css;css" `
            --add-data "../translations/*.qm;translations" `
            --add-data "../qt_translations;qt_translations" `
            --add-data "../themes;themes" `
            --icon=../icon.ico `
            gui.pyw `
            -n python_postar_gui

      - name: Build Updater GUI EXE
        shell: powershell
        run: |
          cd src
          pyinstaller --clean --onefile `
            --icon=../icon.ico `
            updater.py `
            -n updater

      # -------------------------------
      # Prepare portable folder
      # -------------------------------

      - name: Prepare portable folder
        shell: powershell
        run: |
          $STAGE = "src\dist\python_postar_portable"

          New-Item -ItemType Directory -Force -Path "$STAGE\scripts"
          New-Item -ItemType Directory -Force -Path "$STAGE\css"
          New-Item -ItemType Directory -Force -Path "$STAGE\translations"
          New-Item -ItemType Directory -Force -Path "$STAGE\qt_translations"
          New-Item -ItemType Directory -Force -Path "$STAGE\themes"

          # CLI
          Copy-Item -Recurse "src\dist\python_postar\*" "$STAGE\"

          # GUI
          Copy-Item -Recurse "src\dist\python_postar_gui\*" "$STAGE\"

          # Updater
          Copy-Item "src\dist\updater.exe" "$STAGE\"

          # Other files
          Copy-Item "icon.ico" "$STAGE\"
          Copy-Item -Recurse "guides" "$STAGE\"
          Copy-Item -Recurse "css\*" "$STAGE\css\"
          Copy-Item -Recurse "translations\*" "$STAGE\translations\"
          Copy-Item -Recurse "qt_translations\*" "$STAGE\qt_translations\"
          Copy-Item -Recurse "themes\*" "$STAGE\themes\"
          Copy-Item "scripts\postar_batch_portable.bat" "$STAGE\scripts\"

      # -------------------------------
      # Package
      # -------------------------------

      - name: Package portable ZIP
        shell: powershell
        env:
          RELEASE_TAG: ${{ forgejo.ref_name }}
        run: |
          $ErrorActionPreference = "Stop"

          $DIST_FOLDER = Join-Path $PWD "src\dist\python_postar_portable"
          $ZIP_NAME = "python_postar_windows_${env:RELEASE_TAG}_portable.zip"
          $ZIP_PATH = Join-Path $PWD $ZIP_NAME

          Write-Host "Portable folder:"
          Write-Host $DIST_FOLDER

          Write-Host ""
          Write-Host "Portable folder contents:"
          Get-ChildItem -Path $DIST_FOLDER -Recurse |
            ForEach-Object {
              Write-Host $_.FullName.Substring($DIST_FOLDER.Length + 1)
            }

          # Remove an existing ZIP if present
          if (Test-Path $ZIP_PATH) {
            Remove-Item $ZIP_PATH -Force
          }

          # Create ZIP while preserving the complete directory structure
          Compress-Archive `
            -Path "$DIST_FOLDER\*" `
            -DestinationPath $ZIP_PATH `
            -CompressionLevel Optimal `
            -Force

          Write-Host ""
          Write-Host "Created: $ZIP_PATH"

          # -------------------------------
          # Verify ZIP structure
          # -------------------------------

          $VERIFY_DIR = Join-Path $PWD "_zip_verify"

          if (Test-Path $VERIFY_DIR) {
            Remove-Item $VERIFY_DIR -Recurse -Force
          }

          Expand-Archive `
            -Path $ZIP_PATH `
            -DestinationPath $VERIFY_DIR `
            -Force

          Write-Host ""
          Write-Host "ZIP contents:"
          Get-ChildItem -Path $VERIFY_DIR -Recurse |
            ForEach-Object {
              Write-Host $_.FullName.Substring($VERIFY_DIR.Length + 1)
            }

          # Verify expected directories
          $requiredDirectories = @(
            "scripts",
            "css",
            "translations",
            "qt_translations",
            "themes"
          )

          foreach ($directory in $requiredDirectories) {
            $path = Join-Path $VERIFY_DIR $directory

            if (-not (Test-Path $path -PathType Container)) {
              throw "ZIP verification failed: missing directory '$directory'"
            }
          }

          Write-Host ""
          Write-Host "ZIP structure verified successfully."

          # Cleanup verification directory
          Remove-Item $VERIFY_DIR -Recurse -Force


      # -------------------------------
      # Upload to existing Forgejo release
      # -------------------------------

      - name: Upload release asset
        shell: powershell
        env:
          FORGEJO_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          FORGEJO_SERVER: ${{ forgejo.server_url }}
          FORGEJO_REPOSITORY: ${{ forgejo.repository }}
          RELEASE_TAG: ${{ forgejo.ref_name }}
        run: |
          $ErrorActionPreference = "Stop"

          # -------------------------------
          # Find ZIP
          # -------------------------------

          $zip = Get-ChildItem `
            -Path "." `
            -Filter "python_postar_windows_*.zip" |
            Select-Object -First 1

          if (-not $zip) {
            throw "Could not find python_postar_windows_*.zip"
          }

          Write-Host "ZIP: $($zip.FullName)"
          Write-Host "Size: $([math]::Round($zip.Length / 1MB, 2)) MB"

          # -------------------------------
          # Find existing release by tag
          # -------------------------------

          $headers = @{
            "Authorization" = "token $env:FORGEJO_TOKEN"
            "Accept" = "application/json"
          }

          Write-Host ""
          Write-Host "Looking up Forgejo release: $env:RELEASE_TAG"

          $release = Invoke-RestMethod `
            -Uri "$env:FORGEJO_SERVER/api/v1/repos/$env:FORGEJO_REPOSITORY/releases/tags/$env:RELEASE_TAG" `
            -Method Get `
            -Headers $headers

          Write-Host "Found release ID: $($release.id)"
          Write-Host "Release: $($release.name)"

          # -------------------------------
          # Upload ZIP as release asset
          # -------------------------------

          $encodedName = [uri]::EscapeDataString($zip.Name)

          $uploadUrl = "$env:FORGEJO_SERVER/api/v1/repos/$env:FORGEJO_REPOSITORY/releases/$($release.id)/assets?name=$encodedName"

          Write-Host ""
          Write-Host "Uploading $($zip.Name)..."

          & curl.exe `
            --fail `
            --silent `
            --show-error `
            --request POST `
            --header "Authorization: token $env:FORGEJO_TOKEN" `
            --header "Accept: application/json" `
            --form "attachment=@$($zip.FullName);type=application/zip" `
            "$uploadUrl"

          if ($LASTEXITCODE -ne 0) {
            throw "Forgejo release asset upload failed with exit code $LASTEXITCODE"
          }

          Write-Host ""
          Write-Host "Successfully uploaded $($zip.Name)"
          Write-Host "Release: $env:RELEASE_TAG"
