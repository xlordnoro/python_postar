name: Build macOS dmg

on:
  release:
    types: [published]

jobs:
  build-macos-x86_64:
    runs-on: macos-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v7

      # ---------------------------------------------------
      # BUILD .APP
      # ---------------------------------------------------
      - name: Build macOS App Bundle
        shell: bash
        run: |
          set -e

          cd src

          pyinstaller --clean \
            --name python_postar_gui \
            --contents-directory gui_internal \
            --collect-all PyQt6-WebEngine \
            --add-data "../css:css" \
            --add-data "../translations/*.qm:translations" \
            --add-data "../qt_translations:qt_translations" \
            --add-data "../themes:themes" \
            gui.pyw

          echo ""
          echo "=== App bundle structure ==="
          find "dist/python_postar_gui.app/Contents" -maxdepth 3 -print

          echo ""
          echo "=== gui_internal size ==="
          du -sh "dist/python_postar_gui.app/Contents/MacOS/gui_internal"

          echo ""
          echo "=== Main executable size ==="
          ls -lh "dist/python_postar_gui.app/Contents/MacOS/python_postar_gui"

      # ---------------------------------------------------
      # GENERATE .ICNS FROM icon_linux.png
      # ---------------------------------------------------
      - name: Generate ICNS icon
        shell: bash
        run: |
          mkdir icon.iconset

          sips -z 16 16     icon_linux.png --out icon.iconset/icon_16x16.png
          sips -z 32 32     icon_linux.png --out icon.iconset/icon_16x16@2x.png
          sips -z 32 32     icon_linux.png --out icon.iconset/icon_32x32.png
          sips -z 64 64     icon_linux.png --out icon.iconset/icon_32x32@2x.png
          sips -z 128 128   icon_linux.png --out icon.iconset/icon_128x128.png
          sips -z 256 256   icon_linux.png --out icon.iconset/icon_128x128@2x.png
          sips -z 256 256   icon_linux.png --out icon.iconset/icon_256x256.png
          sips -z 512 512   icon_linux.png --out icon.iconset/icon_256x256@2x.png
          sips -z 512 512   icon_linux.png --out icon.iconset/icon_512x512.png
          sips -z 1024 1024 icon_linux.png --out icon.iconset/icon_512x512@2x.png

          iconutil -c icns icon.iconset -o python_postar_gui.icns

      # ---------------------------------------------------
      # INJECT ICON INTO .APP
      # ---------------------------------------------------
      - name: Attach icon to app
        shell: bash
        run: |
          set -e

          APP_PATH="src/dist/python_postar_gui.app"

          cp python_postar_gui.icns \
            "$APP_PATH/Contents/Resources/"

          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleIconFile python_postar_gui.icns" \
            "$APP_PATH/Contents/Info.plist"

          # Re-sign the app after modifying its contents.
          codesign \
            --force \
            --deep \
            --sign - \
            "$APP_PATH"

          echo "Code signature:"
          codesign \
            --verify \
            --deep \
            --strict \
            --verbose=2 \
            "$APP_PATH"

      - name: Verify macOS application
        shell: bash
        run: |
          set -e

          APP_PATH="src/dist/python_postar_gui.app"

          echo "Checking code signature..."
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

          echo ""
          echo "Checking Gatekeeper assessment..."
          spctl --assess --type execute --verbose=4 "$APP_PATH" || true

          echo ""
          echo "Application architecture:"
          file "$APP_PATH/Contents/MacOS/python_postar_gui"

      # ---------------------------------------------------
      # CREATE DMG
      # ---------------------------------------------------
      - name: Create DMG
        shell: bash
        env:
          RELEASE_TAG: ${{ forgejo.ref_name }}
        run: |
          set -e

          APP_NAME="python_postar_gui.app"
          DMG_NAME="python_postar_macos_x86_64_${RELEASE_TAG}.dmg"

          # Clean leftovers
          rm -rf dmg_temp
          rm -f "$DMG_NAME"

          # Detach any mounted volumes just in case
          hdiutil detach "/Volumes/Python Postar" 2>/dev/null || true

          mkdir dmg_temp

          cp -R "src/dist/$APP_NAME" dmg_temp/
          ln -s /Applications dmg_temp/Applications

          hdiutil create \
            -volname "Python Postar" \
            -srcfolder dmg_temp \
            -ov \
            -format UDZO \
            "$DMG_NAME"

          # Cleanup temp folder
          rm -rf dmg_temp

          echo "Created $DMG_NAME"

      # ---------------------------------------------------
      # UPLOAD DMG TO EXISTING FORGEJO RELEASE
      # ---------------------------------------------------
      - name: Upload Release Asset
        shell: bash
        env:
          FORGEJO_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          FORGEJO_SERVER: ${{ forgejo.server_url }}
          FORGEJO_REPOSITORY: ${{ forgejo.repository }}
          RELEASE_TAG: ${{ forgejo.ref_name }}
        run: |
          set -e

          echo "Looking up Forgejo release: $RELEASE_TAG"

          RELEASE_JSON=$(curl \
            --fail \
            --silent \
            --show-error \
            --header "Authorization: token $FORGEJO_TOKEN" \
            --header "Accept: application/json" \
            "$FORGEJO_SERVER/api/v1/repos/$FORGEJO_REPOSITORY/releases/tags/$RELEASE_TAG")

          RELEASE_ID=$(python3 -c 'import sys, json; print(json.load(sys.stdin)["id"])' <<< "$RELEASE_JSON")

          if [ -z "$RELEASE_ID" ] || [ "$RELEASE_ID" = "null" ]; then
            echo "Could not determine Forgejo release ID."
            exit 1
          fi

          echo "Found release ID: $RELEASE_ID"

          DMG_NAME="python_postar_macos_x86_64_${RELEASE_TAG}.dmg"

          if [ ! -f "$DMG_NAME" ]; then
            echo "Could not find $DMG_NAME"
            exit 1
          fi

          echo "Uploading: $DMG_NAME"

          ENCODED_NAME=$(python3 -c "import urllib.parse; print(urllib.parse.quote('''$DMG_NAME'''))")

          curl \
            --fail \
            --silent \
            --show-error \
            --request POST \
            --header "Authorization: token $FORGEJO_TOKEN" \
            --header "Accept: application/json" \
            --form "attachment=@$DMG_NAME" \
            "$FORGEJO_SERVER/api/v1/repos/$FORGEJO_REPOSITORY/releases/$RELEASE_ID/assets?name=$ENCODED_NAME"

          echo ""
          echo "Successfully uploaded: $DMG_NAME"
          echo "Release: $RELEASE_TAG"
