name: Build macOS dmg

on:
release:
types: [published]

jobs:
build-macos-x86_64:
runs-on: macos-latest
timeout-minutes: 120

steps:
  - uses: actions/checkout@v7

  # ---------------------------------------------------
  # BUILD .APP
  # ---------------------------------------------------
  - name: Build macOS App Bundle
    shell: bash
    run: |
      set -e

      cd src

      pyinstaller --clean \
        --windowed \
        --name python_postar_gui \
        --contents-directory gui_internal \
        --collect-all PyQt6-WebEngine \
        --add-data "../css:css" \
        --add-data "../translations/*.qm:translations" \
        --add-data "../qt_translations:qt_translations" \
        --add-data "../themes:themes" \
        gui.pyw

      echo ""
      echo "Generated application:"
      find dist/python_postar_gui.app -maxdepth 3 -type d | sort

      echo ""
      echo "Application contents:"
      find dist/python_postar_gui.app -maxdepth 2 -type f | sort

  # ---------------------------------------------------
  # GENERATE .ICNS FROM icon_linux.png
  # ---------------------------------------------------
  - name: Generate ICNS icon
    shell: bash
    run: |
      set -e

      mkdir -p icon.iconset

      sips -z 16 16     icon_linux.png --out icon.iconset/icon_16x16.png
      sips -z 32 32     icon_linux.png --out icon.iconset/icon_16x16@2x.png
      sips -z 32 32     icon_linux.png --out icon.iconset/icon_32x32.png
      sips -z 64 64     icon_linux.png --out icon.iconset/icon_32x32@2x.png
      sips -z 128 128   icon_linux.png --out icon.iconset/icon_128x128.png
      sips -z 256 256   icon_linux.png --out icon.iconset/icon_128x128@2x.png
      sips -z 256 256   icon_linux.png --out icon.iconset/icon_256x256.png
      sips -z 512 512   icon_linux.png --out icon.iconset/icon_256x256@2x.png
      sips -z 512 512   icon_linux.png --out icon.iconset/icon_512x512.png
      sips -z 1024 1024 icon_linux.png --out icon.iconset/icon_512x512@2x.png

      iconutil -c icns \
        icon.iconset \
        -o python_postar_gui.icns

  # ---------------------------------------------------
  # INJECT ICON INTO .APP
  # ---------------------------------------------------
  - name: Attach icon to app
    shell: bash
    run: |
      set -e

      APP_PATH="src/dist/python_postar_gui.app"

      echo "Checking application structure..."

      if [ ! -d "$APP_PATH" ]; then
        echo "ERROR: Application bundle does not exist:"
        echo "$APP_PATH"
        exit 1
      fi

      # PyInstaller normally creates these directories.
      # Create Resources explicitly so the icon injection
      # does not depend on a particular PyInstaller layout.
      mkdir -p "$APP_PATH/Contents/Resources"

      cp python_postar_gui.icns \
        "$APP_PATH/Contents/Resources/python_postar_gui.icns"

      /usr/libexec/PlistBuddy \
        -c "Set :CFBundleIconFile python_postar_gui.icns" \
        "$APP_PATH/Contents/Info.plist"

      # Re-sign the app after modifying its contents.
      codesign \
        --force \
        --deep \
        --sign - \
        "$APP_PATH"

      echo ""
      echo "Code signature:"
      codesign \
        --verify \
        --deep \
        --strict \
        --verbose=2 \
        "$APP_PATH"

  # ---------------------------------------------------
  # VERIFY APP STRUCTURE
  # ---------------------------------------------------
  - name: Verify macOS application
    shell: bash
    run: |
      set -e

      APP_PATH="src/dist/python_postar_gui.app"

      echo "Application bundle:"
      find "$APP_PATH" -maxdepth 3 -type d | sort

      echo ""
      echo "Checking gui_internal..."

      if [ -d "$APP_PATH/Contents/gui_internal" ]; then
        echo "gui_internal found at:"
        echo "$APP_PATH/Contents/gui_internal"
      elif [ -d "$APP_PATH/Contents/Resources/gui_internal" ]; then
        echo "gui_internal found at:"
        echo "$APP_PATH/Contents/Resources/gui_internal"
      else
        echo "WARNING: gui_internal directory was not found."
      fi

      echo ""
      echo "Checking code signature..."
      codesign \
        --verify \
        --deep \
        --strict \
        --verbose=2 \
        "$APP_PATH"

      echo ""
      echo "Checking Gatekeeper assessment..."
      spctl \
        --assess \
        --type execute \
        --verbose=4 \
        "$APP_PATH" || true

      echo ""
      echo "Application architecture:"
      file "$APP_PATH/Contents/MacOS/python_postar_gui"

  # ---------------------------------------------------
  # CREATE DMG
  # ---------------------------------------------------
  - name: Create DMG
    shell: bash
    env:
      RELEASE_TAG: ${{ forgejo.ref_name }}
    run: |
      set -e

      APP_NAME="python_postar_gui.app"
      DMG_NAME="python_postar_macos_x86_64_${RELEASE_TAG}.dmg"

      # Clean leftovers
      rm -rf dmg_temp
      rm -f "$DMG_NAME"

      # Detach any mounted volumes just in case
      hdiutil detach "/Volumes/Python Postar" 2>/dev/null || true

      mkdir -p dmg_temp

      # Copy the ENTIRE .app bundle.
      # This includes gui_internal and all other
      # PyInstaller-generated contents.
      cp -R \
        "src/dist/$APP_NAME" \
        "dmg_temp/"

      # Applications shortcut
      ln -s /Applications \
        "dmg_temp/Applications"

      echo ""
      echo "DMG contents:"
      find dmg_temp -maxdepth 4 -print | sort

      hdiutil create \
        -volname "Python Postar" \
        -srcfolder dmg_temp \
        -ov \
        -format UDZO \
        "$DMG_NAME"

      # Cleanup temp folder
      rm -rf dmg_temp

      echo ""
      echo "Created $DMG_NAME"

  # ---------------------------------------------------
  # UPLOAD DMG TO EXISTING FORGEJO RELEASE
  # ---------------------------------------------------
  - name: Upload Release Asset
    shell: bash
    env:
      FORGEJO_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      FORGEJO_SERVER: ${{ forgejo.server_url }}
      FORGEJO_REPOSITORY: ${{ forgejo.repository }}
      RELEASE_TAG: ${{ forgejo.ref_name }}
    run: |
      set -e

      echo "Looking up Forgejo release: $RELEASE_TAG"

      RELEASE_JSON=$(curl \
        --fail \
        --silent \
        --show-error \
        --header "Authorization: token $FORGEJO_TOKEN" \
        --header "Accept: application/json" \
        "$FORGEJO_SERVER/api/v1/repos/$FORGEJO_REPOSITORY/releases/tags/$RELEASE_TAG")

      RELEASE_ID=$(python3 -c \
        'import sys, json; print(json.load(sys.stdin)["id"])' \
        <<< "$RELEASE_JSON")

      if [ -z "$RELEASE_ID" ] || [ "$RELEASE_ID" = "null" ]; then
        echo "Could not determine Forgejo release ID."
        exit 1
      fi

      echo "Found release ID: $RELEASE_ID"

      DMG_NAME="python_postar_macos_x86_64_${RELEASE_TAG}.dmg"

      if [ ! -f "$DMG_NAME" ]; then
        echo "Could not find $DMG_NAME"
        exit 1
      fi

      echo "Uploading: $DMG_NAME"

      ENCODED_NAME=$(python3 -c \
        "import urllib.parse; print(urllib.parse.quote('''$DMG_NAME'''))")

      curl \
        --fail \
        --silent \
        --show-error \
        --request POST \
        --header "Authorization: token $FORGEJO_TOKEN" \
        --header "Accept: application/json" \
        --form "attachment=@$DMG_NAME" \
        "$FORGEJO_SERVER/api/v1/repos/$FORGEJO_REPOSITORY/releases/$RELEASE_ID/assets?name=$ENCODED_NAME"

      echo ""
      echo "Successfully uploaded: $DMG_NAME"
      echo "Release: $RELEASE_TAG"
