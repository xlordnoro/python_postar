name: Build Portable Python App

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.14.6

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller PyQt6 PyQt6-WebEngine requests pymediainfo packaging

          python -c "import PyQt6; print('PyQt6:', PyQt6.__version__)"
          python -c "import PyQt6.QtWebEngineCore as w; print('QtWebEngineCore:', w.__file__)"
          python -c "import PyQt6.QtWebEngineWidgets as w; print('QtWebEngineWidgets:', w.__file__)"
          python -c "import importlib.metadata; print('PyQt6-WebEngine:', importlib.metadata.version('PyQt6-WebEngine'))"
          python -c "import importlib.metadata; print('PyQt6-WebEngine-Qt6:', importlib.metadata.version('PyQt6-WebEngine-Qt6'))"
          python -m pip show PyQt6-WebEngine

      # -------------------------------
      # Build Windows EXEs
      # -------------------------------

      - name: Build Python script EXE
        shell: pwsh
        run: |
          cd src
          pyinstaller --clean --onedir --icon=../icon.ico python_postar.py

      - name: Build GUI EXE
        shell: pwsh
        run: |
          cd src
          pyinstaller --clean python_postar_gui.spec

      - name: Build Updater GUI EXE
        shell: pwsh
        run: |
          cd src
          pyinstaller --clean --onefile --icon=../icon.ico updater.py -n updater

      # -------------------------------
      # Prepare portable folder
      # -------------------------------

      - name: Prepare portable folder
        shell: pwsh
        run: |
          $STAGE = "src\dist\python_postar_portable"

          New-Item -ItemType Directory -Force -Path "$STAGE\scripts"
          New-Item -ItemType Directory -Force -Path "$STAGE\css"
          New-Item -ItemType Directory -Force -Path "$STAGE\translations"
          New-Item -ItemType Directory -Force -Path "$STAGE\qt_translations"
          New-Item -ItemType Directory -Force -Path "$STAGE\themes"
          New-Item -ItemType Directory -Force -Path "$STAGE\webengine"

          Copy-Item -Recurse src\dist\python_postar\* "$STAGE\"
          Copy-Item src\dist\python_postar_gui.exe "$STAGE\"
          Copy-Item src\dist\updater.exe "$STAGE\"
          Copy-Item icon.ico "$STAGE\"

          Copy-Item -Recurse guides "$STAGE\"
          Copy-Item -Recurse css\* "$STAGE\css\"
          Copy-Item -Recurse translations\* "$STAGE\translations\"
          Copy-Item -Recurse qt_translations\* "$STAGE\qt_translations\"
          Copy-Item -Recurse themes\* "$STAGE\themes\"
          Copy-Item scripts\postar_batch_portable.bat "$STAGE\scripts\"

      # -------------------------------
      # Extract external Qt WebEngine
      # -------------------------------

      - name: Diagnose WebEngine runtime
        shell: pwsh
        run: |
          $PYQT6 = python -c "import PyQt6; print(PyQt6.__path__[0])"
          $QT6 = Join-Path $PYQT6 "Qt6"

          Write-Host "=========================================="
          Write-Host "PyQt6 WebEngine Runtime Discovery"
          Write-Host "=========================================="
          Write-Host "PyQt6: $PYQT6"
          Write-Host "Qt6:   $QT6"
          Write-Host ""

          $TARGETS = @(
              "Qt6WebEngine.dll",
              "Qt6WebEngineCore.dll",
              "Qt6WebEngineWidgets.dll",
              "QtWebEngineProcess.exe",
              "icudtl.dat",
              "v8_context_snapshot.bin",
              "qtwebengine_resources.pak",
              "qtwebengine_resources_100p.pak",
              "qtwebengine_resources_200p.pak",
              "qtwebengine_devtools_resources.pak"
          )

          foreach ($TARGET in $TARGETS) {
              Write-Host ""
              Write-Host "Searching for: $TARGET"

              $FOUND = Get-ChildItem $QT6 -Recurse -File -Filter $TARGET -ErrorAction SilentlyContinue

              if ($FOUND) {
                  foreach ($FILE in $FOUND) {
                      Write-Host "  FOUND: $($FILE.FullName)"
                      Write-Host "  SIZE:  $($FILE.Length) bytes"
                  }
              }
              else {
                  Write-Host "  NOT FOUND"
              }
          }

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "Qt6 directory structure"
          Write-Host "=========================================="

          Get-ChildItem $QT6 -Directory |
              Select-Object FullName

      # -------------------------------
      # Package portable ZIP
      # -------------------------------

      - name: Package portable ZIP
        shell: pwsh
        run: |
          $DIST_FOLDER = "src\dist\python_postar_portable"
          $ZIP_NAME = "python_postar_windows_${env:GITHUB_REF_NAME}_portable.zip"

          Compress-Archive `
            -Path "$DIST_FOLDER\*" `
            -DestinationPath $ZIP_NAME `
            -Force

          Write-Host "Created $ZIP_NAME"

      # -------------------------------
      # Upload release asset
      # -------------------------------

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: python_postar_windows_${{ github.ref_name }}_portable.zip
