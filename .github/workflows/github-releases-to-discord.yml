on:
  release:
    types: [published]

jobs:
  github-releases-to-discord:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: GitHub Releases to Discord
        uses: SethCohen/github-releases-to-discord@v1
        with:
          webhook_url: ${{ secrets.WEBHOOK_URL }}
          color: "3447003"
          username: "Meiru-Nee Changelog"
          avatar_url: "https://cdn.discordapp.com/avatars/1071981334085521459/c77a7b42dc4f70a7070a8f875d8a87b5.png"
          content: "<@&234659298024620042>"
          reduce_headings: true
